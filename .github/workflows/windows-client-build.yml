name: Windows Client Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - modern-windows
      - windows-debug-vmprotect-compat

permissions:
  contents: read

jobs:
  build-win32-debug:
    name: Debug | Win32 (x86)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out modern-windows
        uses: actions/checkout@v4

      - name: Locate Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Microsoft Visual C++ 2012 Update 4 x86 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "vcredist_2012_x86.exe"
          $uri = "https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x86.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Visual C++ 2012 x86 redistributable signature is not valid or is not signed by Microsoft."
          }
          "Verified Microsoft-signed Visual C++ 2012 Update 4 x86 installer."
          $process = Start-Process -FilePath $installer -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru
          "Visual C++ 2012 x86 installer exit code: $($process.ExitCode)"
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual C++ 2012 x86 runtime installation failed with exit code $($process.ExitCode)."
          }
          foreach ($dll in @("MSVCP110.dll", "MSVCR110.dll")) {
            $path = Join-Path $env:WINDIR "SysWOW64\\$dll"
            if (-not (Test-Path $path)) { throw "VC++ 2012 x86 runtime DLL was not installed: $path" }
            "Verified runtime DLL: $path"
          }

      - name: Inspect CoreScriptConverter DLL dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          $rsc = Join-Path $env:GITHUB_WORKSPACE "CoreScriptConverter2\tool\win32\rsc.exe"
          if (-not (Test-Path $rsc)) { throw "Checked-in CoreScriptConverter executable is missing: $rsc" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe is missing; cannot locate dumpbin." }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw "Could not locate Visual Studio installation." }
          $dumpbin = Get-ChildItem (Join-Path $vsRoot "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match "\\Hostx64\\x86\\dumpbin\.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "Could not locate x86-capable dumpbin.exe." }
          "CoreScriptConverter executable: $rsc"
          "dumpbin: $($dumpbin.FullName)"
          "Direct imported DLLs:"
          $dependents = & $dumpbin.FullName /nologo /dependents $rsc 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed: $dependents" }
          $dependents | Tee-Object -FilePath build-logs/corescript-dll-dependencies.txt
          $searchDirs = @(
            (Split-Path $rsc),
            (Join-Path $env:WINDIR "System32"),
            (Join-Path $env:WINDIR "SysWOW64"),
            (Join-Path $vsRoot "VC\Redist\MSVC")
          ) + ($env:PATH -split ";")
          $dllNames = @($dependents | ForEach-Object {
            if ($_ -match "^\s+([A-Za-z0-9_.-]+\.dll)\s*$") { $Matches[1] }
          } | Sort-Object -Unique)
          "Direct dependency availability:"
          foreach ($dll in $dllNames) {
            $found = $false
            foreach ($dir in $searchDirs) {
              if ([string]::IsNullOrWhiteSpace($dir) -or -not (Test-Path $dir -PathType Container)) { continue }
              if (Test-Path (Join-Path $dir $dll)) {
                "FOUND  $dll  $dir"
                $found = $true
                break
              }
            }
            if (-not $found) { "MISSING $dll" }
          }
      - name: Record Windows build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          "Runner image: windows-2022" | Tee-Object -FilePath build-logs/environment.txt
          "Source commit: $env:GITHUB_SHA" | Tee-Object -Append -FilePath build-logs/environment.txt
          "MSBuild:" | Tee-Object -Append -FilePath build-logs/environment.txt
          (Get-Command msbuild).Source | Tee-Object -Append -FilePath build-logs/environment.txt
          "Visual Studio installations:" | Tee-Object -Append -FilePath build-logs/environment.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json | Tee-Object -Append -FilePath build-logs/environment.txt
          }
          "v110 toolset locations:" | Tee-Object -Append -FilePath build-logs/environment.txt
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              Get-ChildItem (Join-Path $_.FullName "MSBuild\Microsoft.Cpp") -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "110|v110" } |
                Select-Object -ExpandProperty FullName
            } | Tee-Object -Append -FilePath build-logs/environment.txt

      - name: Restore pinned legacy Boost and zlib dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $contrib = Join-Path $env:RUNNER_TEMP "legacy-contrib"
          New-Item -ItemType Directory -Force -Path $contrib | Out-Null
          "CONTRIB_PATH=$contrib" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Download the exact Boost version referenced by the legacy project files.
          $boostZip = Join-Path $env:RUNNER_TEMP "boost_1_56_0.zip"
          $boostUrl = "https://archives.boost.io/release/1.56.0/source/boost_1_56_0.zip"
          Invoke-WebRequest -Uri $boostUrl -OutFile $boostZip
          $expected = "be168dd499a4929bb9e4ce8b3fc9d6d08a9d1ac2da9f51e70d1945f4acb23041"
          $actual = (Get-FileHash -Path $boostZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Boost archive SHA256 mismatch: $actual" }

          $boostExtract = Join-Path $env:RUNNER_TEMP "boost-extract"
          Expand-Archive -Path $boostZip -DestinationPath $boostExtract -Force
          $boostRoot = Join-Path $boostExtract "boost_1_56_0"
          $boostTarget = Join-Path $contrib "boost_1_56_0"
          Move-Item -Path $boostRoot -Destination $boostTarget

          # This fork requires a ROBLOX_BOOST_CONFIGS marker in Boost's user config.
          # The legacy config was not included in the repository, so provide the
          # minimal compatibility marker in the CI dependency overlay (not game source).
          $boostUserConfig = Join-Path $boostTarget "boost\config\user.hpp"
          @'
          #pragma once
          #define ROBLOX_BOOST_CONFIGS
          '@ | Set-Content -Path $boostUserConfig -Encoding ascii

          # Boost 1.56 assumes the old MSVC fpos API. Microsoft removed
          # seekpos() and _FPOSOFF in the VS2022 STL; apply Boost iostreams PR #57
          # to this temporary dependency copy only.
          $boostFposConfig = Join-Path $boostTarget "boost\iostreams\detail\config\fpos.hpp"
          $fposText = (Get-Content -Path $boostFposConfig -Raw) -replace "`r`n", "`n"
          $oldFposCondition = '# if (defined(_YVALS) || defined(_CPPLIB_VER)) && !defined(__SGI_STL_PORT) && \' + "`n" + '     !defined(_STLPORT_VERSION) && !defined(__QNX__)' + "`n"
          $newFposCondition = '# if (defined(_YVALS) || defined(_CPPLIB_VER)) && !defined(__SGI_STL_PORT) && \' + "`n" + '     !defined(_STLPORT_VERSION) && !defined(__QNX__) && \' + "`n" + '     !(defined(BOOST_MSVC) && _MSVC_STL_VERSION >= 141)' + "`n"
          if (-not $fposText.Contains($oldFposCondition)) {
            throw "Boost 1.56 fpos configuration did not match the expected upstream patch context."
          }
          $fposText = $fposText.Replace($oldFposCondition, $newFposCondition)
          Set-Content -Path $boostFposConfig -Value $fposText -Encoding ascii
          New-Item -ItemType Directory -Force -Path (Join-Path $boostTarget "include") | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $boostTarget "include\boost") -Target (Join-Path $boostTarget "boost") | Out-Null

          # Reuse the repository's checked-in zlib sources and x86 library.
          $zlibTarget = Join-Path $contrib "windows\x86\zlib\zlib-1.2.8"
          $zlibInclude = Join-Path $zlibTarget "include\zlib"
          $zlibLib = Join-Path $zlibTarget "lib"
          New-Item -ItemType Directory -Force -Path $zlibInclude,$zlibLib | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "zlib\*") -Destination $zlibInclude -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "zlib\zlib.lib") -Destination $zlibLib -Force

          "Prepared Boost 1.56.0 and repository zlib dependencies under $contrib"
          "Boost SHA256: $actual"
          "zlib header: $(Test-Path (Join-Path $zlibInclude 'zlib.h'))"
          "zlib library: $(Test-Path (Join-Path $zlibLib 'zlib.lib'))"

      - name: Restore pinned SDL 2.0.4 headers and x86 import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "SDL2-devel-2.0.4-VC.zip"
          $url = "https://www.libsdl.org/release/SDL2-devel-2.0.4-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $archiveHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "SDL2 2.0.4 official VC archive SHA256: $archiveHash" | Tee-Object -FilePath build-logs/sdl-dependency.txt

          $extract = Join-Path $env:RUNNER_TEMP "sdl-2.0.4-extract"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $header = Get-ChildItem -Path $extract -Filter "SDL_scancode.h" -Recurse -File | Select-Object -First 1
          if (-not $header) { throw "SDL2 2.0.4 archive did not contain SDL_scancode.h." }
          $includeDir = $header.Directory.FullName
          $sdlInclude = Join-Path $env:RUNNER_TEMP "legacy-contrib\SDL2.0.4\include"
          New-Item -ItemType Directory -Force -Path $sdlInclude | Out-Null
          Copy-Item -Path (Join-Path $includeDir "*") -Destination $sdlInclude -Recurse -Force

          # The repository carries the matching Windows SDL2.0.4 import library.
          $repoLib = Join-Path $env:GITHUB_WORKSPACE "SDL2\Win\2.0.4\SDL2.lib"
          if (-not (Test-Path $repoLib)) { throw "Expected checked-in SDL2.0.4 import library is missing: $repoLib" }
          $sdlLibDir = Join-Path $env:RUNNER_TEMP "legacy-contrib\SDL2\VisualC\Win32\Release"
          New-Item -ItemType Directory -Force -Path $sdlLibDir | Out-Null
          Copy-Item -Path $repoLib -Destination (Join-Path $sdlLibDir "SDL2.lib") -Force

          foreach ($required in @("SDL.h", "SDL_scancode.h")) {
            if (-not (Test-Path (Join-Path $sdlInclude $required))) { throw "SDL header staging failed: $required" }
          }
          "SDL headers staged: $sdlInclude" | Tee-Object -Append -FilePath build-logs/sdl-dependency.txt
          "SDL x86 import library staged: $(Join-Path $sdlLibDir 'SDL2.lib')" | Tee-Object -Append -FilePath build-logs/sdl-dependency.txt

      - name: Restore remaining open-source dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $contrib = $env:CONTRIB_PATH
          if ([string]::IsNullOrWhiteSpace($contrib)) { throw "CONTRIB_PATH was not initialized." }

          # Rebuild the pinned OpenSSL 1.0.2u and curl 7.43.0 sources with the
          # current VS2022 toolset. The checked-in VS2010 archives reference the
          # removed __iob_func CRT symbol and cannot be linked by this toolchain.
          $networkRoot = Join-Path $env:RUNNER_TEMP "legacy-network-deps"
          $opensslRoot = Join-Path $networkRoot "openssl1_0-win-build"
          $zlibRoot = Join-Path $networkRoot "zlib-win-build"
          New-Item -ItemType Directory -Force -Path $networkRoot | Out-Null

          git clone --filter=blob:none --no-checkout https://github.com/kiyolee/openssl1_0-win-build.git $opensslRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not clone the pinned OpenSSL 1.0.2u source/build repository." }
          git -C $opensslRoot checkout --detach dcd4ba976135542b74e65e96da45ff62693abdec
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned OpenSSL 1.0.2u revision." }
          if ((git -C $opensslRoot rev-parse HEAD).Trim() -ne "dcd4ba976135542b74e65e96da45ff62693abdec") {
            throw "OpenSSL source revision did not match the pinned commit."
          }

          git clone --filter=blob:none --no-checkout https://github.com/kiyolee/zlib-win-build.git $zlibRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not clone the pinned zlib source/build repository." }
          git -C $zlibRoot checkout --detach 92c8faa3abc5d6a7965271ba397e7decec485912
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned zlib revision." }
          if ((git -C $zlibRoot rev-parse HEAD).Trim() -ne "92c8faa3abc5d6a7965271ba397e7decec485912") {
            throw "zlib source revision did not match the pinned commit."
          }

          # The VS2022 OpenSSL project generates x86 assembly from Perl scripts.
          if (-not (Get-Command perl.exe -ErrorAction SilentlyContinue)) {
            throw "Perl is required by the pinned OpenSSL 1.0.2u VS2022 build."
          }
          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            $env:Path = "$env:Path;C:\Program Files\NASM"
          }
          $perlExe = (Get-Command perl.exe -ErrorAction Stop).Source
          $nasmExe = (Get-Command nasm.exe -ErrorAction Stop).Source
          $env:PERL = "perl.exe"
          $env:NASM = "nasm.exe"
          "OpenSSL Perl: $perlExe" | Tee-Object -FilePath build-logs/network-dependencies.txt
          "OpenSSL NASM: $nasmExe" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt

          # Build zlib for the same x86 Debug configuration expected by OpenSSL.
          $zlibOut = Join-Path $zlibRoot "build-VS2022\Debug"
          New-Item -ItemType Directory -Force -Path $zlibOut | Out-Null
          $zlibSolution = Join-Path $zlibRoot "build-VS2022\zlib.sln"
          $zlibOutArg = $zlibOut.TrimEnd('\') + '\'
          & msbuild.exe $zlibSolution /t:libz-static /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=$zlibOutArg" /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Pinned zlib x86 Debug build failed with exit code $LASTEXITCODE." }
          $zlibLibrary = Get-ChildItem -Path $zlibOut -Filter "*.lib" -File -Recurse | Select-Object -First 1
          if (-not $zlibLibrary) { throw "Pinned zlib build completed without producing a static library in $zlibOut." }
          "Built zlib: $($zlibLibrary.FullName)" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt

          # Build the original OpenSSL 1.0.2u source using projects explicitly
          # authored for Visual Studio 2022 / v143, rather than the VS2010 binaries.
          $opensslOut = Join-Path $opensslRoot "build-VS2022\Win32\Debug"
          New-Item -ItemType Directory -Force -Path $opensslOut | Out-Null
          $opensslSolution = Join-Path $opensslRoot "build-VS2022\openssl1_0-lite.sln"
          $opensslOutArg = $opensslOut.TrimEnd('\') + '\'
          & msbuild.exe $opensslSolution "/t:libeay32-static;ssleay32-static" /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=$opensslOutArg" /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Pinned OpenSSL 1.0.2u x86 Debug build failed with exit code $LASTEXITCODE." }

          $cryptoLibrary = Get-ChildItem -Path $opensslOut -Filter "*libeay32*.lib" -File -Recurse | Select-Object -First 1
          $sslLibrary = Get-ChildItem -Path $opensslOut -Filter "*ssleay32*.lib" -File -Recurse | Select-Object -First 1
          $opensslHeaders = Join-Path $opensslOut "include\openssl"
          if (-not $cryptoLibrary -or -not $sslLibrary) {
            throw "OpenSSL build did not produce both libeay32 and ssleay32 static libraries."
          }
          if (-not (Test-Path (Join-Path $opensslHeaders "ssl.h"))) {
            throw "OpenSSL build did not stage the generated include\openssl\ssl.h header."
          }

          # Preserve the legacy filenames and include layout expected by the
          # existing WindowsClient project and curl 7.43.0 project template.
          $opensslTarget = Join-Path $contrib "openssl"
          $opensslOut32 = Join-Path $opensslTarget "out32"
          New-Item -ItemType Directory -Force -Path $opensslOut32 | Out-Null
          Copy-Item $cryptoLibrary.FullName (Join-Path $opensslOut32 "libeay32.lib") -Force
          Copy-Item $sslLibrary.FullName (Join-Path $opensslOut32 "ssleay32.lib") -Force
          "Built OpenSSL crypto: $($cryptoLibrary.FullName)" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt
          "Built OpenSSL SSL: $($sslLibrary.FullName)" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt

          # Restore and build the matching curl 7.43.0 source using its VC12
          # project template retargeted to the installed VS2022 v143 toolset.
          $curlZip = Join-Path $env:RUNNER_TEMP "curl-7.43.0.zip"
          Invoke-WebRequest -Uri "https://curl.se/download/curl-7.43.0.zip" -OutFile $curlZip
          $curlHash = (Get-FileHash $curlZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "curl 7.43.0 archive SHA256: $curlHash" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt
          $curlExtract = Join-Path $env:RUNNER_TEMP "curl-7.43.0-extract"
          Expand-Archive $curlZip $curlExtract -Force
          $curlHeader = Get-ChildItem $curlExtract -Filter curl.h -Recurse -File | Select-Object -First 1
          if (-not $curlHeader) { throw "curl 7.43.0 archive did not contain curl.h." }
          $curlRoot = $curlHeader.Directory.Parent.Parent.FullName

          # curl's legacy VC12 template expects a sibling OpenSSL tree named
          # openssl with inc32\openssl headers and out32 library filenames.
          $curlParent = Split-Path $curlRoot -Parent
          $curlOpenSSL = Join-Path $curlParent "openssl"
          $curlOpenSSLInc = Join-Path $curlOpenSSL "inc32\openssl"
          $curlOpenSSLOut = Join-Path $curlOpenSSL "out32"
          New-Item -ItemType Directory -Force -Path $curlOpenSSLInc,$curlOpenSSLOut | Out-Null
          Copy-Item (Join-Path $opensslHeaders "*") $curlOpenSSLInc -Recurse -Force
          Copy-Item $cryptoLibrary.FullName (Join-Path $curlOpenSSLOut "libeay32.lib") -Force
          Copy-Item $sslLibrary.FullName (Join-Path $curlOpenSSLOut "ssleay32.lib") -Force

          $curlGenerator = Join-Path $curlRoot "projects\generate.bat"
          if (-not (Test-Path $curlGenerator -PathType Leaf)) {
            # curl's release source archive omits this tracked helper script.
            # Restore it from the exact upstream 7.43.0 tag commit.
            New-Item -ItemType Directory -Force -Path (Split-Path $curlGenerator -Parent) | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/curl/curl/38e07886ed2792988217a2ffa482ce3a69ca92c2/projects/generate.bat" -OutFile $curlGenerator
            $generatorBlob = (& git hash-object $curlGenerator).Trim()
            if ($generatorBlob -ne "2aa04de909550564c40182dbc7b088ef47295ae4") {
              throw "Restored curl 7.43.0 generator did not match the pinned upstream Git blob: $generatorBlob"
            }
          }
          # The curl release archive also omits both VC12 project templates.
          # Restore the exact files tracked by the pinned upstream tag commit.
          $curlTemplates = @(
            @{
              RelativePath = "Windows\VC12\lib\libcurl.tmpl"
              Blob = "65098efd72a4b77a4e0b1cbde8bbaba082c4a1a5"
            },
            @{
              RelativePath = "Windows\VC12\src\curlsrc.tmpl"
              Blob = "88ace4964b8881babbc5e5f8bca053f834383567"
            }
          )
          foreach ($template in $curlTemplates) {
            $templatePath = Join-Path $curlRoot ("projects\{0}" -f $template.RelativePath)
            if (-not (Test-Path $templatePath -PathType Leaf)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $templatePath -Parent) | Out-Null
              $templateUrl = "https://raw.githubusercontent.com/curl/curl/38e07886ed2792988217a2ffa482ce3a69ca92c2/projects/$($template.RelativePath.Replace('\', '/'))"
              Invoke-WebRequest -Uri $templateUrl -OutFile $templatePath
            }
            $templateBlob = (& git hash-object $templatePath).Trim()
            if ($templateBlob -ne $template.Blob) {
              throw "Restored curl VC12 template $($template.RelativePath) did not match its pinned upstream Git blob: $templateBlob"
            }
          }
          # The release archive renames curlbuild.h.dist to curlbuild.h,
          # while generate.bat expects the original .dist filename. Restore
          # the exact pinned upstream template for its prerequisite-copy step.
          $curlBuildDist = Join-Path $curlRoot "include\curl\curlbuild.h.dist"
          if (-not (Test-Path $curlBuildDist -PathType Leaf)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/curl/curl/38e07886ed2792988217a2ffa482ce3a69ca92c2/include/curl/curlbuild.h.dist" -OutFile $curlBuildDist
          }
          $curlBuildDistBlob = (& git hash-object $curlBuildDist).Trim()
          if ($curlBuildDistBlob -ne "f09419a843915154a89f4fa0ac04bfdcfa5fb615") {
            throw "Restored curlbuild.h.dist did not match its pinned upstream Git blob: $curlBuildDistBlob"
          }
          # Run from the curl source root and pass a relative batch path. This
          # avoids cmd.exe's nested-quote parsing of the runner's absolute temp path.
          Push-Location $curlRoot
          try {
            & $env:ComSpec /d /c "call projects\generate.bat vc12"
            $generatorExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($generatorExit -ne 0) { throw "curl 7.43.0 VC12 project generation failed with exit code $generatorExit." }

          $curlProject = Join-Path $curlRoot "projects\Windows\VC12\lib\libcurl.vcxproj"
          if (-not (Test-Path $curlProject)) { throw "curl 7.43.0 VC12 generator did not create libcurl.vcxproj." }
          & msbuild.exe $curlProject "/p:Configuration=LIB Debug - LIB OpenSSL" /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "curl 7.43.0 x86 Debug static-library build failed with exit code $LASTEXITCODE." }

          $curlBuildOut = Join-Path $curlRoot "build\Win32\VC12\LIB Debug - LIB OpenSSL"
          $curlLibraries = @(Get-ChildItem -Path $curlBuildOut -Filter "*.lib" -File -Recurse | Where-Object { $_.Name -match "curl" })
          if ($curlLibraries.Count -ne 1) {
            throw "Expected one curl static library in $curlBuildOut, found $($curlLibraries.Count)."
          }

          $curlTarget = Join-Path $contrib "windows\x86\curl\curl-7.43.0"
          New-Item -ItemType Directory -Force -Path (Join-Path $curlTarget "include\curl"),(Join-Path $curlTarget "lib") | Out-Null
          Copy-Item (Join-Path $curlRoot "include\curl\*") (Join-Path $curlTarget "include\curl") -Recurse -Force
          Copy-Item $curlLibraries[0].FullName (Join-Path $curlTarget "lib\libcurl_a.lib") -Force
          "Built curl static library: $($curlLibraries[0].FullName)" | Tee-Object -Append -FilePath build-logs/network-dependencies.txt
          "Staged rebuilt OpenSSL and curl x86 Debug libraries for WindowsClient." | Tee-Object -Append -FilePath build-logs/network-dependencies.txt

          # Restore the upstream cpp-netlib 0.11.0 source release from Debian's archived
          # orig tarball. The old GitHub tag-archive URL now returns HTTP 404.
          $netlibTar = Join-Path $env:RUNNER_TEMP "cpp-netlib_0.11.0.orig.tar.gz"
          $netlibUrl = "https://archive.debian.org/debian/pool/main/c/cpp-netlib/cpp-netlib_0.11.0.orig.tar.gz"
          Invoke-WebRequest -Uri $netlibUrl -OutFile $netlibTar
          $netlibHash = (Get-FileHash $netlibTar -Algorithm SHA256).Hash.ToLowerInvariant()
          "cpp-netlib 0.11.0 upstream source SHA256: $netlibHash" | Tee-Object -Append -FilePath build-logs/dependencies.txt
          $netlibExtract = Join-Path $env:RUNNER_TEMP "cpp-netlib-extract"
          New-Item -ItemType Directory -Force -Path $netlibExtract | Out-Null
          & tar.exe -xzf $netlibTar -C $netlibExtract
          if ($LASTEXITCODE -ne 0) { throw "Could not extract cpp-netlib 0.11.0 source archive (tar exit $LASTEXITCODE)." }
          $netlibUri = Get-ChildItem $netlibExtract -Filter "uri.cpp" -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]libs[\\/]network[\\/]src[\\/]uri[\\/]uri\.cpp$' } |
            Select-Object -First 1
          if (-not $netlibUri) { throw "cpp-netlib 0.11.0 archive is missing libs/network/src/uri/uri.cpp." }
          $netlibRoot = $netlibUri.Directory.Parent.Parent.Parent.Parent.FullName
          if (-not (Test-Path (Join-Path $netlibRoot "boost\\network"))) {
            throw "cpp-netlib source root is missing boost/network: $netlibRoot"
          }
          $netlibTarget = Join-Path $contrib "cpp-netlib-0.11.0-final"
          New-Item -ItemType Directory -Force -Path $netlibTarget | Out-Null
          Copy-Item (Join-Path $netlibRoot "*") $netlibTarget -Recurse -Force

          # W3C's archived 5.4.0 source distribution.
          $wwwZip = Join-Path $env:RUNNER_TEMP "w3c-libwww-5.4.0.zip"
          Invoke-WebRequest -Uri "https://www.w3.org/Library/Distribution/old/w3c-libwww-5.4.0.zip" -OutFile $wwwZip
          $wwwHash = (Get-FileHash $wwwZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "W3C libwww 5.4.0 archive SHA256: $wwwHash" | Tee-Object -Append -FilePath build-logs/dependencies.txt
          $wwwExtract = Join-Path $env:RUNNER_TEMP "w3c-libwww-extract"
          Expand-Archive $wwwZip $wwwExtract -Force
          $wwwLibrary = Get-ChildItem $wwwExtract -Directory -Recurse | Where-Object {
            $_.Name -eq "Library" -and (Test-Path (Join-Path $_.FullName "src"))
          } | Select-Object -First 1
          if (-not $wwwLibrary) { throw "W3C libwww archive did not contain a Library\src directory." }
          $wwwRoot = $wwwLibrary.Parent.FullName
          $wwwTarget = Join-Path $contrib "w3c-libwww-5.4.0"
          Copy-Item $wwwRoot $wwwTarget -Recurse -Force

          # W3C documents POSIX regex as an optional Windows add-on requiring
          # an external GNU regex package (rxposix.h + gnu_regex.lib/dll).
          # This client only consumes HTParse from libwww, not the regex API.
          # Disable the optional feature only in the CI-staged dependency copy.
          $wwwWindowsConfig = Join-Path $wwwTarget "Library\src\windows\config.h"
          if (-not (Test-Path $wwwWindowsConfig)) {
            throw "W3C libwww Windows config.h is missing: $wwwWindowsConfig"
          }
          Add-Content -Path $wwwWindowsConfig -Value "`r`n#undef HT_POSIX_REGEX`r`n#undef HAVE_REGEX_H" -Encoding Ascii
          $wwwConfigText = Get-Content -Path $wwwWindowsConfig -Raw
          if ($wwwConfigText -notmatch '(?m)^#undef HT_POSIX_REGEX\s*$' -or
              $wwwConfigText -notmatch '(?m)^#undef HAVE_REGEX_H\s*$') {
            throw "W3C libwww optional POSIX regex disablement was not staged correctly."
          }
          "Disabled optional W3C POSIX regex in the CI-only libwww dependency copy."

          # This 2012-era client requires the legacy DirectX SDK headers.
          # The hosted Windows SDK image no longer ships the Direct3D 9 header.
          $dxSdkInstaller = Join-Path $env:RUNNER_TEMP "DXSDK_Jun10.exe"
          $dxSdkUrl = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          Invoke-WebRequest -Uri $dxSdkUrl -OutFile $dxSdkInstaller
          $dxSdkHash = (Get-FileHash $dxSdkInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedDxSdkHash = "705271dc83bfee54d9b94e028426e288d5f070784b7446d164f48ecfbb2a02cb"
          if ($dxSdkHash -ne $expectedDxSdkHash) {
            throw "DirectX SDK June 2010 SHA256 mismatch: $dxSdkHash"
          }
          "DirectX SDK June 2010 SHA256: $dxSdkHash" | Tee-Object -Append -FilePath build-logs/dependencies.txt

          $dxSdkInstall = Start-Process -FilePath $dxSdkInstaller -ArgumentList "/U" -Wait -PassThru -NoNewWindow
          "DirectX SDK installer exit code: $($dxSdkInstall.ExitCode)" |
            Tee-Object -Append -FilePath build-logs/dependencies.txt
          $dxSdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft DirectX SDK (June 2010)"
          $dxSdkInclude = Join-Path $dxSdkRoot "Include"
          $dxSdkLibX86 = Join-Path $dxSdkRoot "Lib\x86"
          if (-not (Test-Path (Join-Path $dxSdkInclude "d3d9.h"))) {
            throw "DirectX SDK installer did not provide Include\d3d9.h at $dxSdkInclude."
          }
          if (-not (Test-Path $dxSdkLibX86)) {
            throw "DirectX SDK x86 library directory is missing: $dxSdkLibX86"
          }

          $sdkTarget = Join-Path $contrib "SDK"
          New-Item -ItemType Directory -Force -Path (Join-Path $sdkTarget "Include"),(Join-Path $sdkTarget "Lib") | Out-Null
          Copy-Item (Join-Path $dxSdkInclude "*") (Join-Path $sdkTarget "Include") -Recurse -Force
          Copy-Item (Join-Path $dxSdkLibX86 "*") (Join-Path $sdkTarget "Lib") -Recurse -Force

          # June 2010 renamed the legacy DirectX 9 error library from DxErr9.lib
          # to DxErr.lib. Keep the old project dependency name available in this
          # CI-only SDK overlay by providing the documented compatibility alias.
          $dxErrSource = Join-Path $sdkTarget "Lib\DxErr.lib"
          $dxErrLegacyAlias = Join-Path $sdkTarget "Lib\DxErr9.lib"
          if (-not (Test-Path $dxErrSource -PathType Leaf)) {
            throw "DirectX SDK June 2010 is missing the expected DxErr.lib: $dxErrSource"
          }
          Copy-Item -Path $dxErrSource -Destination $dxErrLegacyAlias -Force
          if (-not (Test-Path $dxErrLegacyAlias -PathType Leaf)) {
            throw "Could not stage the legacy DxErr9.lib compatibility alias."
          }
          "Staged DxErr.lib as DxErr9.lib for the legacy project dependency." |
            Tee-Object -Append -FilePath build-logs/dependencies.txt

          "Staged DirectX SDK June 2010 x86 headers and libraries." |
            Tee-Object -Append -FilePath build-logs/dependencies.txt

      - name: Restore and build Microsoft DirectShow base classes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sampleRepo = Join-Path $env:RUNNER_TEMP "windows-classic-samples"
          $samplePath = "Samples/Win7Samples/multimedia/directshow/baseclasses"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-classic-samples.git $sampleRepo
          if ($LASTEXITCODE -ne 0) { throw "Could not clone Microsoft's Windows Classic Samples repository." }
          git -C $sampleRepo sparse-checkout set $samplePath
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the DirectShow base-class sample directory." }

          $baseSource = Join-Path $sampleRepo $samplePath
          foreach ($required in @("streams.h", "baseclasses.vcproj", "amfilter.cpp")) {
            if (-not (Test-Path (Join-Path $baseSource $required))) {
              throw "Microsoft DirectShow base-class source is incomplete: $required"
            }
          }

          $dsRoot = Join-Path $env:CONTRIB_PATH "DSBaseClasses"
          $dsSources = Join-Path $dsRoot "Sources"
          $dsLib = Join-Path $dsRoot "Lib"
          New-Item -ItemType Directory -Force -Path $dsSources,$dsLib | Out-Null
          Copy-Item (Join-Path $baseSource "*") $dsSources -Recurse -Force

          # Build the official Microsoft sample as an x86 Debug static library.
          # The legacy project is a VS2005 .vcproj, so use a temporary VS2022
          # project rather than changing or converting the repository's source.
          $projectPath = Join-Path $env:RUNNER_TEMP "DirectShowBaseClasses.vcxproj"
          $objectPath = Join-Path $env:RUNNER_TEMP "DirectShowBaseClasses-obj"
          New-Item -ItemType Directory -Force -Path $objectPath | Out-Null
          $project = @'
          <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Debug|Win32">
                <Configuration>Debug</Configuration>
                <Platform>Win32</Platform>
              </ProjectConfiguration>
            </ItemGroup>
            <PropertyGroup Label="Globals">
              <ProjectGuid>{E8A3F6FA-AE1C-4C8E-A0B6-9C8480324EAA}</ProjectGuid>
              <Keyword>Win32Proj</Keyword>
              <RootNamespace>DirectShowBaseClasses</RootNamespace>
              <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
            <PropertyGroup Label="Configuration">
              <ConfigurationType>StaticLibrary</ConfigurationType>
              <UseDebugLibraries>true</UseDebugLibraries>
              <PlatformToolset>v143</PlatformToolset>
              <CharacterSet>Unicode</CharacterSet>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
            <PropertyGroup>
              <OutDir>__OUT_DIR__\</OutDir>
              <IntDir>__OBJ_DIR__\</IntDir>
            </PropertyGroup>
            <ItemDefinitionGroup>
              <ClCompile>
                <WarningLevel>Level3</WarningLevel>
                <Optimization>Disabled</Optimization>
                <RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>
                <PreprocessorDefinitions>WIN32;_DEBUG;_LIB;%(PreprocessorDefinitions)</PreprocessorDefinitions>
                <AdditionalIncludeDirectories>__SOURCE_DIR__;__DXSDK_INCLUDE__;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
              <Lib>
                <OutputFile>__OUT_DIR__\strmbasd.lib</OutputFile>
                <TargetMachine>MachineX86</TargetMachine>
                <AdditionalDependencies>strmiids.lib;%(AdditionalDependencies)</AdditionalDependencies>
                <AdditionalLibraryDirectories>__DXSDK_LIB__;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
              </Lib>
            </ItemDefinitionGroup>
            <ItemGroup>
              <ClCompile Include="__SOURCE_DIR__\*.cpp" />
            </ItemGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@
          $project = $project.Replace("__SOURCE_DIR__", $dsSources)
          $dxSdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft DirectX SDK (June 2010)"
          $project = $project.Replace("__DXSDK_INCLUDE__", (Join-Path $dxSdkRoot "Include"))
          $project = $project.Replace("__DXSDK_LIB__", (Join-Path $dxSdkRoot "Lib\x86"))
          $project = $project.Replace("__OUT_DIR__", $dsLib)
          $project = $project.Replace("__OBJ_DIR__", $objectPath)
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          msbuild $projectPath /m /p:Configuration=Debug /p:Platform=Win32 /v:minimal
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { throw "DirectShow base-class Debug library build failed with exit code $buildExit." }
          if (-not (Test-Path (Join-Path $dsLib "strmbasd.lib"))) {
            throw "DirectShow build completed without producing strmbasd.lib."
          }
          "Microsoft DirectShow headers staged: $dsSources"
          "Microsoft DirectShow Debug library built: $(Join-Path $dsLib 'strmbasd.lib')"

      - name: Apply scoped VS2022 Debug compatibility settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $namespace = "http://schemas.microsoft.com/developer/msbuild/2003"
          $debugCondition = '''$(Configuration)|$(Platform)''==''Debug|Win32'''

          function Add-DebugWarningSuppressions([string]$relativePath, [string[]]$warningIds, [string[]]$definitionsToAdd = @()) {
            $projectPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (-not (Test-Path $projectPath)) { throw "Expected project file not found: $relativePath" }
            [xml]$projectXml = Get-Content -Path $projectPath
            $ns = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
            $ns.AddNamespace("msb", $namespace)
            $itemDefinition = $projectXml.SelectNodes("//msb:ItemDefinitionGroup", $ns) |
              Where-Object { $_.GetAttribute("Condition") -eq $debugCondition } |
              Select-Object -First 1
            if (-not $itemDefinition) { throw "Debug|Win32 item definition group was not found in $relativePath." }
            $compile = $itemDefinition.SelectSingleNode("msb:ClCompile", $ns)
            if (-not $compile) { throw "Debug|Win32 compiler settings were not found in $relativePath." }

            if ($definitionsToAdd.Count -gt 0) {
              $definitions = $compile.SelectSingleNode("msb:PreprocessorDefinitions", $ns)
              if (-not $definitions) { throw "PreprocessorDefinitions were not found in $relativePath." }
              foreach ($definition in $definitionsToAdd) {
                if (-not $definitions.InnerText.Contains($definition)) {
                  $definitions.InnerText = $definition + ";" + $definitions.InnerText
                }
              }
            }

            $disabled = $compile.SelectSingleNode("msb:DisableSpecificWarnings", $ns)
            if (-not $disabled) {
              $disabled = $projectXml.CreateElement("DisableSpecificWarnings", $namespace)
              [void]$compile.AppendChild($disabled)
            }
            $existingIds = @($disabled.InnerText -split ";" | Where-Object { $_ })
            foreach ($id in $warningIds) {
              if ($existingIds -notcontains $id) { $existingIds += $id }
            }
            $disabled.InnerText = ($existingIds -join ";")
            $projectXml.Save($projectPath)
            "Applied Debug|Win32-only warning compatibility settings to ${relativePath}: $($warningIds -join ', ')"
          }

          Add-DebugWarningSuppressions "Network\Network.vcxproj" @("4005", "4267", "4838", "4477", "4996") @("_WINSOCK_DEPRECATED_NO_WARNINGS")
          Add-DebugWarningSuppressions "Log\Log.vcxproj" @("4996")
          Add-DebugWarningSuppressions "Base\Base.vcxproj" @("4996")
          Add-DebugWarningSuppressions "App\App.vcxproj" @("4005", "4267", "4305", "4316")
          # WindowsClient compiles Boost.Program_options sources directly in this project.
          # Boost.Filesystem sources are already compiled into the referenced boost.static project;
          # suppress its separate VC12 auto-link request in the WindowsClient Debug build.
          # Disable Boost auto-link for this component in Debug so MSVC does not request
          # the absent vc120 prebuilt library alongside those in-project sources.
          # WindowsClient and the CI-extended boost.static library both use the
          # in-project Boost sources. Scope Date_Time auto-link suppression to these
          # Debug|Win32 projects only; suppress C4005 here because the legacy
          # ScriptInformationProvider header also defines this macro in client files.
          Add-DebugWarningSuppressions "WindowsClient\WindowsClient.vcxproj" @("4005") @("BOOST_PROGRAM_OPTIONS_NO_LIB", "BOOST_DATE_TIME_NO_LIB", "BOOST_SYSTEM_NO_LIB", "BOOST_CHRONO_NO_LIB", "BOOST_FILESYSTEM_NO_LIB", "BOOST_IOSTREAMS_NO_LIB", "BOOST_THREAD_NO_LIB")
          Add-DebugWarningSuppressions "boostlibs\boost.static.vcxproj" @() @("BOOST_DATE_TIME_NO_LIB")
          # Boost auto-link directives can originate in objects from any
          # dependent project, not only WindowsClient. Apply targeted suppressions
          # to every Debug|Win32 C++ project in this CI workspace. Implementations
          # remain provided by boost.static; Release and NoOpt are untouched.
          $threadPatchedProjects = 0
          $systemPatchedProjects = 0
          $chronoPatchedProjects = 0
          $dateTimePatchedProjects = 0
          $filesystemPatchedProjects = 0
          $iostreamsPatchedProjects = 0
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.vcxproj" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\](\.git|\.vs|packages)[\\]' } |
            ForEach-Object {
              $projectPath = $_.FullName
              [xml]$projectXml = Get-Content -Path $projectPath
              $ns = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
              $ns.AddNamespace("msb", $namespace)
              $debugGroups = @($projectXml.SelectNodes("//msb:ItemDefinitionGroup", $ns) |
                Where-Object { $_.GetAttribute("Condition") -eq $debugCondition })
              foreach ($itemDefinition in $debugGroups) {
                $compile = $itemDefinition.SelectSingleNode("msb:ClCompile", $ns)
                if (-not $compile) { continue }
                $definitions = $compile.SelectSingleNode("msb:PreprocessorDefinitions", $ns)
                if (-not $definitions) { continue }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_THREAD_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_THREAD_NO_LIB;" + $definitions.InnerText
                  $threadPatchedProjects++
                }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_SYSTEM_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_SYSTEM_NO_LIB;" + $definitions.InnerText
                  $systemPatchedProjects++
                }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_CHRONO_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_CHRONO_NO_LIB;" + $definitions.InnerText
                  $chronoPatchedProjects++
                }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_DATE_TIME_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_DATE_TIME_NO_LIB;" + $definitions.InnerText
                  $dateTimePatchedProjects++
                }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_FILESYSTEM_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_FILESYSTEM_NO_LIB;" + $definitions.InnerText
                  $filesystemPatchedProjects++
                }
                if ($definitions.InnerText -notmatch '(^|;)BOOST_IOSTREAMS_NO_LIB(;|$)') {
                  $definitions.InnerText = "BOOST_IOSTREAMS_NO_LIB;" + $definitions.InnerText
                  $iostreamsPatchedProjects++
                }
              }
              if ($debugGroups.Count -gt 0) { $projectXml.Save($projectPath) }
            }
          "Applied BOOST_THREAD_NO_LIB to Debug|Win32 compiler settings in $threadPatchedProjects project(s)."
          "Applied BOOST_SYSTEM_NO_LIB to Debug|Win32 compiler settings in $systemPatchedProjects project(s)."
          "Applied BOOST_CHRONO_NO_LIB to Debug|Win32 compiler settings in $chronoPatchedProjects project(s)."
          "Applied BOOST_DATE_TIME_NO_LIB to Debug|Win32 compiler settings in $dateTimePatchedProjects project(s)."
          "Applied BOOST_FILESYSTEM_NO_LIB to Debug|Win32 compiler settings in $filesystemPatchedProjects project(s)."
          "Applied BOOST_IOSTREAMS_NO_LIB to Debug|Win32 compiler settings in $iostreamsPatchedProjects project(s)."


          # The legacy WindowsClient references boost.static.vcxproj, which does not
          # include Boost.Date_Time's compiled sources in the tracked project. Add
          # the four official Boost 1.56 translation units to that static library in
          # this CI workspace. No tracked C++ or project files are modified.
          $boostProjectPath = Join-Path $env:GITHUB_WORKSPACE "boostlibs\boost.static.vcxproj"
          if (-not (Test-Path $boostProjectPath)) { throw "Boost static project is missing: $boostProjectPath" }
          [xml]$boostProjectXml = Get-Content -Path $boostProjectPath
          $boostNs = New-Object System.Xml.XmlNamespaceManager($boostProjectXml.NameTable)
          $boostNs.AddNamespace("msb", $namespace)
          $boostCompileGroup = $boostProjectXml.SelectNodes("//msb:ItemGroup[msb:ClCompile]", $boostNs) |
            Select-Object -First 1
          if (-not $boostCompileGroup) { throw "Could not find the Boost static project's ClCompile item group." }
          $dateTimeSources = @(
            '$(CONTRIB_PATH)\boost_1_56_0\libs\date_time\src\gregorian\greg_month.cpp',
            '$(CONTRIB_PATH)\boost_1_56_0\libs\date_time\src\gregorian\greg_weekday.cpp',
            '$(CONTRIB_PATH)\boost_1_56_0\libs\date_time\src\gregorian\date_generators.cpp',
            '$(CONTRIB_PATH)\boost_1_56_0\libs\date_time\src\posix_time\posix_time_types.cpp'
          )
          foreach ($source in $dateTimeSources) {
            $resolved = $source.Replace('$(CONTRIB_PATH)', $env:CONTRIB_PATH)
            if (-not (Test-Path $resolved -PathType Leaf)) { throw "Required Boost Date_Time source is missing: $resolved" }
            $existing = $boostCompileGroup.SelectSingleNode("msb:ClCompile[@Include='$source']", $boostNs)
            if (-not $existing) {
              $item = $boostProjectXml.CreateElement("ClCompile", $namespace)
              $item.SetAttribute("Include", $source)
              [void]$boostCompileGroup.AppendChild($item)
            }
          }
          $boostProjectXml.Save($boostProjectPath)
          "Added Boost 1.56 Date_Time sources to the CI-only boost.static project."

          # ScriptInformationProvider.h already defines BOOST_DATE_TIME_NO_LIB.
          # Do not inject it globally through Directory.Build.props: that creates
          # C4005 macro-redefinition warnings in projects that include the header.
          # The Date_Time implementation sources above are linked through boost.static.
          "Boost.Date_Time sources are staged in the CI-only boost.static project; using the repository's existing header-level auto-link setting."
          # W3C HTParse.h defines PARSE_ANCHOR as an alias for PARSE_VIEW.
          # That macro collides with the PARSE_ANCHOR enum member in the Windows SDK urlmon.h.
          # Http.cpp only needs HTParse flags such as PARSE_PATH, so undefine the alias
          # in this CI workspace immediately after the W3C header is included.
          $httpSourcePath = Join-Path $env:GITHUB_WORKSPACE "App\util\Shared\Http.cpp"
          if (-not (Test-Path $httpSourcePath)) { throw "Expected HTTP source file not found: $httpSourcePath" }
          $httpSourceText = Get-Content -Path $httpSourcePath -Raw
          $httpInclude = '#include "util/HTW3C.h"'
          if ([regex]::Matches($httpSourceText, [regex]::Escape($httpInclude)).Count -ne 1) {
            throw "Expected exactly one W3C HTW3C include in App/util/Shared/Http.cpp."
          }
          if ($httpSourceText.Contains("#undef PARSE_ANCHOR")) {
            throw "PARSE_ANCHOR compatibility guard is already present; refusing to patch twice."
          }
          $httpSourceText = $httpSourceText.Replace($httpInclude, $httpInclude + "`r`n#undef PARSE_ANCHOR")
          Set-Content -Path $httpSourcePath -Value $httpSourceText -Encoding utf8
          "Applied CI-only W3C PARSE_ANCHOR macro collision fix to App/util/Shared/Http.cpp."
      - name: Instrument CoreScriptConverter in CI workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $batchPath = Join-Path $env:GITHUB_WORKSPACE "CoreScriptConverter2\tool\win32\BuildCoreScripts.bat"
          if (-not (Test-Path $batchPath)) { throw "CoreScriptConverter batch file is missing: $batchPath" }
          $batch = Get-Content -Path $batchPath -Raw
          $original = "rsc.exe --rscloc %1 --verbose"
          $diagnostic = @'
          ECHO CoreScriptConverter working directory: %CD%
          ECHO CoreScriptConverter config argument: %~f1
          rsc.exe --rscloc %1 --verbose
          SET RSC_EXIT_CODE=%ERRORLEVEL%
          ECHO CoreScriptConverter exit code: %RSC_EXIT_CODE%
          IF NOT "%RSC_EXIT_CODE%"=="0" EXIT /b %RSC_EXIT_CODE%
          IF NOT EXIST "%~dp0..\..\..\App\script\LuaGenCSNew.inl" (
            ECHO ERROR: CoreScriptConverter returned success but LuaGenCSNew.inl was not created at the expected repository path.
            EXIT /b 91
          )
          ECHO Generated LuaGenCSNew.inl exists.
          '@
          if ([regex]::Matches($batch, [regex]::Escape($original)).Count -ne 1) {
            throw "Expected exactly one CoreScriptConverter invocation; refusing to patch an unexpected batch file."
          }
          $batch = $batch.Replace($original, $diagnostic.TrimEnd())
          Set-Content -Path $batchPath -Value $batch -Encoding ascii
          "Applied CI-only CoreScriptConverter diagnostics. Tracked batch file remains unchanged."
          
      - name: Check legacy prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Check-WindowsClientPrerequisites.ps1 -Configuration Debug 2>&1 |
            Tee-Object -FilePath build-logs/prerequisites.txt
          $checkerExit = $LASTEXITCODE
          "Prerequisite checker exit code: $checkerExit" |
            Tee-Object -Append -FilePath build-logs/prerequisites.txt
          if ($checkerExit -ne 0) {
            throw "Required legacy dependencies are missing. MSBuild was not started; see prerequisites.txt."
          }

      - name: Build and verify RbxDebug runtime dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # RbxDebug.vcxproj writes directly to RbxDebug\bin\Debug, which is
          # also the location consumed by WindowsClient's PublishDLLDependency entries.
          msbuild .\RbxDebug\RbxDebug.vcxproj /m /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { throw "RbxDebug Debug|Win32 build failed with exit code $buildExit." }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "RbxDebug\bin\Debug"
          foreach ($name in @("RbxDebug.dll", "RbxDebug.pdb")) {
            $output = Join-Path $outputDir $name
            if (-not (Test-Path $output -PathType Leaf)) {
              throw "RbxDebug build did not produce the required output: $output"
            }
            "Verified RbxDebug output: $output"
          }

      - name: Attempt native Debug Win32 build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          # Use the runner's installed VS2022 v143 toolset as a CI-only compatibility probe.
          # This does not rewrite project files or claim equivalence with the original v110 compiler.
          msbuild .\Client_2012.sln /m /t:WindowsClient /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal 2>&1 |
            Tee-Object -FilePath build-logs/msbuild.txt
          $code = $LASTEXITCODE
          "MSBuild exit code: $code" | Tee-Object -Append -FilePath build-logs/msbuild.txt
          "BUILD_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0

      - name: Collect any generated executable
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter RobloxPlayerBetaRaw.exe -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination build-logs -Force }
          Get-ChildItem build-logs -File | Select-Object Name,Length

      - name: Upload build logs and executable if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-debug-win32
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Report build result
        if: always()
        shell: pwsh
        run: |
          if ($env:BUILD_EXIT_CODE -eq "0") {
            Write-Host "MSBuild completed successfully."
          } elseif ([string]::IsNullOrWhiteSpace($env:BUILD_EXIT_CODE)) {
            Write-Host "MSBuild was not attempted because prerequisite validation failed. See the uploaded logs artifact."
            exit 1
          } else {
            Write-Host "MSBuild failed with exit code $env:BUILD_EXIT_CODE. See the uploaded logs artifact."
            exit 1
          }
