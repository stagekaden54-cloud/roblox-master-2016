name: Windows Client Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - modern-windows

permissions:
  contents: read

jobs:
  build-win32-debug:
    name: Debug | Win32 (x86)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out modern-windows
        uses: actions/checkout@v4

      - name: Locate Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Record Windows build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          "Runner image: windows-2022" | Tee-Object -FilePath build-logs/environment.txt
          "MSBuild:" | Tee-Object -Append -FilePath build-logs/environment.txt
          (Get-Command msbuild).Source | Tee-Object -Append -FilePath build-logs/environment.txt
          "Visual Studio installations:" | Tee-Object -Append -FilePath build-logs/environment.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json | Tee-Object -Append -FilePath build-logs/environment.txt
          }
          "v110 toolset locations:" | Tee-Object -Append -FilePath build-logs/environment.txt
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              Get-ChildItem (Join-Path $_.FullName "MSBuild\Microsoft.Cpp") -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "110|v110" } |
                Select-Object -ExpandProperty FullName
            } | Tee-Object -Append -FilePath build-logs/environment.txt

      - name: Restore pinned legacy Boost and zlib dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $contrib = Join-Path $env:RUNNER_TEMP "legacy-contrib"
          New-Item -ItemType Directory -Force -Path $contrib | Out-Null
          "CONTRIB_PATH=$contrib" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Download the exact Boost version referenced by the legacy project files.
          $boostZip = Join-Path $env:RUNNER_TEMP "boost_1_56_0.zip"
          $boostUrl = "https://archives.boost.io/release/1.56.0/source/boost_1_56_0.zip"
          Invoke-WebRequest -Uri $boostUrl -OutFile $boostZip
          $expected = "be168dd499a4929bb9e4ce8b3fc9d6d08a9d1ac2da9f51e70d1945f4acb23041"
          $actual = (Get-FileHash -Path $boostZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Boost archive SHA256 mismatch: $actual" }

          $boostExtract = Join-Path $env:RUNNER_TEMP "boost-extract"
          Expand-Archive -Path $boostZip -DestinationPath $boostExtract -Force
          $boostRoot = Join-Path $boostExtract "boost_1_56_0"
          $boostTarget = Join-Path $contrib "boost_1_56_0"
          Move-Item -Path $boostRoot -Destination $boostTarget

          # This fork requires a ROBLOX_BOOST_CONFIGS marker in Boost's user config.
          # The legacy config was not included in the repository, so provide the
          # minimal compatibility marker in the CI dependency overlay (not game source).
          $boostUserConfig = Join-Path $boostTarget "boost\config\user.hpp"
          @'
          #pragma once
          #define ROBLOX_BOOST_CONFIGS
          '@ | Set-Content -Path $boostUserConfig -Encoding ascii
          New-Item -ItemType Directory -Force -Path (Join-Path $boostTarget "include") | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $boostTarget "include\boost") -Target (Join-Path $boostTarget "boost") | Out-Null

          # Reuse the repository's checked-in zlib sources and x86 library.
          $zlibTarget = Join-Path $contrib "windows\x86\zlib\zlib-1.2.8"
          $zlibInclude = Join-Path $zlibTarget "include\zlib"
          $zlibLib = Join-Path $zlibTarget "lib"
          New-Item -ItemType Directory -Force -Path $zlibInclude,$zlibLib | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "zlib\*") -Destination $zlibInclude -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "zlib\zlib.lib") -Destination $zlibLib -Force

          "Prepared Boost 1.56.0 and repository zlib dependencies under $contrib"
          "Boost SHA256: $actual"
          "zlib header: $(Test-Path (Join-Path $zlibInclude 'zlib.h'))"
          "zlib library: $(Test-Path (Join-Path $zlibLib 'zlib.lib'))"

      - name: Restore pinned SDL 2.0.4 headers and x86 import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "SDL2-devel-2.0.4-VC.zip"
          $url = "https://www.libsdl.org/release/SDL2-devel-2.0.4-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $archiveHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "SDL2 2.0.4 official VC archive SHA256: $archiveHash" | Tee-Object -FilePath build-logs/sdl-dependency.txt

          $extract = Join-Path $env:RUNNER_TEMP "sdl-2.0.4-extract"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $header = Get-ChildItem -Path $extract -Filter "SDL_scancode.h" -Recurse -File | Select-Object -First 1
          if (-not $header) { throw "SDL2 2.0.4 archive did not contain SDL_scancode.h." }
          $includeDir = $header.Directory.FullName
          $sdlInclude = Join-Path $env:RUNNER_TEMP "legacy-contrib\SDL2.0.4\include"
          New-Item -ItemType Directory -Force -Path $sdlInclude | Out-Null
          Copy-Item -Path (Join-Path $includeDir "*") -Destination $sdlInclude -Recurse -Force

          # The repository carries the matching Windows SDL2.0.4 import library.
          $repoLib = Join-Path $env:GITHUB_WORKSPACE "SDL2\Win\2.0.4\SDL2.lib"
          if (-not (Test-Path $repoLib)) { throw "Expected checked-in SDL2.0.4 import library is missing: $repoLib" }
          $sdlLibDir = Join-Path $env:RUNNER_TEMP "legacy-contrib\SDL2\VisualC\Win32\Release"
          New-Item -ItemType Directory -Force -Path $sdlLibDir | Out-Null
          Copy-Item -Path $repoLib -Destination (Join-Path $sdlLibDir "SDL2.lib") -Force

          foreach ($required in @("SDL.h", "SDL_scancode.h")) {
            if (-not (Test-Path (Join-Path $sdlInclude $required))) { throw "SDL header staging failed: $required" }
          }
          "SDL headers staged: $sdlInclude" | Tee-Object -Append -FilePath build-logs/sdl-dependency.txt
          "SDL x86 import library staged: $(Join-Path $sdlLibDir 'SDL2.lib')" | Tee-Object -Append -FilePath build-logs/sdl-dependency.txt

      - name: Check legacy prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Check-WindowsClientPrerequisites.ps1 -Configuration Debug 2>&1 |
            Tee-Object -FilePath build-logs/prerequisites.txt
          $checkerExit = $LASTEXITCODE
          "Prerequisite checker exit code: $checkerExit" |
            Tee-Object -Append -FilePath build-logs/prerequisites.txt
          if ($checkerExit -ne 0) {
            throw "Required legacy dependencies are missing. MSBuild was not started; see prerequisites.txt."
          }

      - name: Attempt native Debug Win32 build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          # Use the runner's installed VS2022 v143 toolset as a CI-only compatibility probe.
          # This does not rewrite project files or claim equivalence with the original v110 compiler.
          msbuild .\Client_2012.sln /m /t:WindowsClient /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal 2>&1 |
            Tee-Object -FilePath build-logs/msbuild.txt
          $code = $LASTEXITCODE
          "MSBuild exit code: $code" | Tee-Object -Append -FilePath build-logs/msbuild.txt
          "BUILD_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0

      - name: Collect any generated executable
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter RobloxPlayerBetaRaw.exe -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination build-logs -Force }
          Get-ChildItem build-logs -File | Select-Object Name,Length

      - name: Upload build logs and executable if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-debug-win32
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Report build result
        if: always()
        shell: pwsh
        run: |
          if ($env:BUILD_EXIT_CODE -eq "0") {
            Write-Host "MSBuild completed successfully."
          } elseif ([string]::IsNullOrWhiteSpace($env:BUILD_EXIT_CODE)) {
            Write-Host "MSBuild was not attempted because prerequisite validation failed. See the uploaded logs artifact."
            exit 1
          } else {
            Write-Host "MSBuild failed with exit code $env:BUILD_EXIT_CODE. See the uploaded logs artifact."
            exit 1
          }
