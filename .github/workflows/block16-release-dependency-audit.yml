name: BLOCK16 Release Dependency Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify Release prerequisites without building
    if: github.ref == 'refs/heads/block16-release-dependency-audit'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Release declarations and dependency paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path audit-report | Out-Null
          $report = 'audit-report/release-dependency-audit.txt'
          "Commit: $env:GITHUB_SHA" | Set-Content $report
          'Path checks only. No compiler, packer, or dependency executable is run.' | Add-Content $report
          $failed = $false
          $projects = @(
            'WindowsClient/WindowsClient.vcxproj',
            'App/App.vcxproj',
            'Base/Base.vcxproj',
            'Network/Network.vcxproj',
            'Log/Log.vcxproj',
            'boostlibs/boost.static.vcxproj',
            'Rendering/GfxCore/GfxCore.vcxproj',
            'RbxDebug/RbxDebug.vcxproj'
          )
          foreach ($project in $projects) {
            $declared = $false
            if (Test-Path -LiteralPath $project -PathType Leaf) {
              [xml]$xml = Get-Content -LiteralPath $project -Raw
              $declared = $null -ne $xml.SelectSingleNode("//*[local-name()='ProjectConfiguration' and @Include='Release|Win32']")
            }
            $status = if ($declared) { 'DECLARED' } else { 'NOT FOUND' }
            "$status | Release / Win32 | $project" | Tee-Object -FilePath $report -Append
            if (-not $declared) { $failed = $true }
          }

          $checker = './scripts/Check-WindowsClientPrerequisites.ps1'
          $haveContribs = -not [string]::IsNullOrWhiteSpace($env:CONTRIB_PATH) -and (Test-Path -LiteralPath $env:CONTRIB_PATH -PathType Container)
          $contrib = ''
          if ($haveContribs) { $contrib = [System.IO.Path]::GetFullPath($env:CONTRIB_PATH) }
          $result = & pwsh -NoProfile -File $checker -Configuration Release -ContribPath $contrib
          $checkerExit = $LASTEXITCODE
          foreach ($line in $result) {
            if ($line -match '^\s*CONTRIB_PATH:') { continue }
            if ($line -match 'VMProtect key file') {
              $line = ($line -split ' -- ', 2)[0]
            } elseif ($haveContribs) {
              $line = $line.Replace($contrib, '<CONTRIB_PATH>', [StringComparison]::OrdinalIgnoreCase)
            }
            $line | Tee-Object -FilePath $report -Append
          }
          if (-not $haveContribs) {
            'NOT INSPECTED | No authorized Contribs directory is mounted on this runner. This does not establish that any archive contents are missing.' | Tee-Object -FilePath $report -Append
            $failed = $true
          }
          if ($checkerExit -ne 0 -or $failed) { throw 'Release prerequisites were not verified; see the audit report.' }
          'Declared project configurations and checked paths passed. Architecture, ABI, licensing, and build success remain unverified.' | Tee-Object -FilePath $report -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block16-release-dependency-audit
          path: audit-report/release-dependency-audit.txt
          if-no-files-found: error
          retention-days: 14
